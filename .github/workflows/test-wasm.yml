name: WASM index ABI regression

on:
  pull_request:
    branches:
      - wasm
    paths:
      - '.github/workflows/test-wasm.yml'
      - 'README.md'
      - 'scripts/**'
      - 'wasm/**'
      - 'profiles/**'

permissions:
  contents: read

jobs:
  wasm:
    name: WASM ABI v3, corruption prefixes and MPEG-TS seek round-trip
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install build and fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build ffmpeg

      - name: Build WASM core variants
        run: |
          chmod +x scripts/build-wasm.sh
          bash scripts/build-wasm.sh --ffmpeg-ref n9.0.1 --clean --skip-package
          bash scripts/build-wasm.sh --ffmpeg-ref n9.0.1 --mt --skip-package

      - name: Verify high-depth PQ and HLG planes against independent FFmpeg
        run: |
          node scripts/test-hdr-planes.mjs dist/voidplayer-ffmpeg-wasm-n9.0.1/voidplayer-core.js
          node scripts/test-hdr-planes.mjs dist/voidplayer-ffmpeg-wasm-mt-n9.0.1/voidplayer-core-mt.js

      - name: Create MPEG-TS regression sample
        run: |
          mkdir -p .build
          ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc2=size=160x90:rate=24" \
            -frames:v 48 -an -c:v mpeg2video -g 12 -bf 2 -pix_fmt yuv420p \
            -f mpegts .build/seek-regression.ts

      - name: Test import, seek anchors, and random-seek pixels
        run: |
          node scripts/test-wasm-node.cjs "dist/voidplayer-ffmpeg-wasm-n9.0.1" .build/seek-regression.ts
          node scripts/test-wasm-node.cjs "dist/voidplayer-ffmpeg-wasm-mt-n9.0.1" --stem voidplayer-core-mt .build/seek-regression.ts

      - name: Check MPEG-PS video probing after decoder trimming
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc2=size=160x96:rate=25" \
            -t 2 -an -c:v mpeg2video -g 12 -f mpeg .build/probe-regression.mpg
          node scripts/test-wasm-node.cjs dist/voidplayer-ffmpeg-wasm-n9.0.1 .build/probe-regression.mpg
          node scripts/test-wasm-node.cjs dist/voidplayer-ffmpeg-wasm-mt-n9.0.1 --stem voidplayer-core-mt .build/probe-regression.mpg
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.build/probe-regression.mpg').read_bytes()
          Path('.build/probe-tail.mpg').write_bytes(source + bytes([0xa5]) * (190 * 1024))
          PY
          node scripts/test-wasm-node.cjs dist/voidplayer-ffmpeg-wasm-n9.0.1 .build/probe-tail.mpg
          node scripts/test-wasm-node.cjs dist/voidplayer-ffmpeg-wasm-mt-n9.0.1 --stem voidplayer-core-mt .build/probe-tail.mpg

      - name: Check MPEG-PS index retains untimed packets without seeking them
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc2=size=160x96:rate=25" \
            -t 2 -an -c:v mpeg2video -g 12 -packetsize 4096 -f mpeg .build/probe-untimed.mpg
          node scripts/test-wasm-node.cjs dist/voidplayer-ffmpeg-wasm-n9.0.1 --require-untimed .build/probe-untimed.mpg
          node scripts/test-wasm-node.cjs dist/voidplayer-ffmpeg-wasm-mt-n9.0.1 --stem voidplayer-core-mt --require-untimed .build/probe-untimed.mpg

      - name: Create long B-frame TS sample
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=128x96:rate=25" \
            -t 70 -an -c:v mpeg2video -threads 1 -g 12 -bf 2 -muxrate 2000000 \
            -f mpegts .build/indexed-seek-regression.ts

      - name: Test pre-index first frame, scan progress, and random-seek pixels
        run: |
          node scripts/test-indexed-seek.mjs dist/voidplayer-ffmpeg-wasm-n9.0.1/voidplayer-core.js .build/indexed-seek-regression.ts
          node scripts/test-indexed-seek.mjs dist/voidplayer-ffmpeg-wasm-mt-n9.0.1/voidplayer-core-mt.js .build/indexed-seek-regression.ts

      - name: Test corrupt tails, retained B pictures, imported prefixes and IO failures
        run: |
          node scripts/test-corrupt-prefix.mjs "$PWD/dist/voidplayer-ffmpeg-wasm-n9.0.1/voidplayer-core.js" .build/indexed-seek-regression.ts
          node scripts/test-corrupt-prefix.mjs "$PWD/dist/voidplayer-ffmpeg-wasm-mt-n9.0.1/voidplayer-core-mt.js" .build/indexed-seek-regression.ts

      - uses: actions/upload-artifact@v4
        with:
          name: corruption-core
          path: dist/voidplayer-ffmpeg-wasm*/
          if-no-files-found: error
