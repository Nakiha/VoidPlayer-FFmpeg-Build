name: Build FFmpeg

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ffmpeg_ref:
        description: "FFmpeg tag or branch"
        required: true
        default: "n8.1"
      dav1d_ref:
        description: "dav1d tag or branch"
        required: true
        default: "1.5.3"
      publish_release:
        description: "Publish a GitHub release for this build"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    env:
      FFMPEG_REF: ${{ github.event.inputs.ffmpeg_ref || 'n8.1' }}
      DAV1D_REF: ${{ github.event.inputs.dav1d_ref || '1.5.3' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: brew install nasm pkg-config

      - name: Setup Python virtualenv
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install meson ninja

      - name: Build package
        run: |
          . .venv/bin/activate
          bash scripts/build-macos.sh \
            --ffmpeg-ref "$FFMPEG_REF" \
            --dav1d-ref "$DAV1D_REF" \
            --clean

      - name: Verify playback surface
        run: |
          config=".build/work/ffmpeg-arm64/ffbuild/config.mak"
          test -f "$config"
          for symbol in \
            CONFIG_MOV_DEMUXER \
            CONFIG_MATROSKA_DEMUXER \
            CONFIG_FLV_DEMUXER \
            CONFIG_AVI_DEMUXER \
            CONFIG_MPEGTS_DEMUXER \
            CONFIG_AAC_DECODER \
            CONFIG_AC3_DECODER \
            CONFIG_EAC3_DECODER \
            CONFIG_MP1_DECODER \
            CONFIG_MP2_DECODER \
            CONFIG_MP3_DECODER \
            CONFIG_DCA_DECODER \
            CONFIG_TRUEHD_DECODER \
            CONFIG_APE_DECODER \
            CONFIG_ALAC_DECODER \
            CONFIG_H264_DECODER \
            CONFIG_HEVC_DECODER \
            CONFIG_VVC_DECODER \
            CONFIG_AV1_DECODER \
            CONFIG_LIBDAV1D_DECODER \
            CONFIG_VVC_PARSER \
            CONFIG_VVC_MP4TOANNEXB_BSF
          do
            grep -q "^${symbol}=yes$" "$config" || {
              echo "Missing required FFmpeg component: ${symbol}" >&2
              exit 1
            }
          done

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidplayer-ffmpeg-macos-arm64-${{ env.FFMPEG_REF }}
          path: |
            dist/voidplayer-ffmpeg-macos-arm64-${{ env.FFMPEG_REF }}.zip
            dist/voidplayer-ffmpeg-macos-arm64-${{ env.FFMPEG_REF }}/voidplayer-ffmpeg-manifest.json
          if-no-files-found: error

      - name: Publish release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voidplayer-ffmpeg-macos-arm64-${{ env.FFMPEG_REF }}
          name: VoidPlayer FFmpeg macOS arm64 ${{ env.FFMPEG_REF }}
          files: dist/voidplayer-ffmpeg-macos-arm64-${{ env.FFMPEG_REF }}.zip
          fail_on_unmatched_files: true

  wasm:
    name: WASM decoder core
    runs-on: ubuntu-24.04
    env:
      FFMPEG_REF: ${{ github.event.inputs.ffmpeg_ref || 'n9.0.1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build WASM core
        run: |
          chmod +x scripts/build-wasm.sh
          bash scripts/build-wasm.sh \
            --ffmpeg-ref "$FFMPEG_REF" \
            --clean

      - name: Smoke test core
        run: node scripts/test-wasm-node.cjs "dist/voidplayer-ffmpeg-wasm-${{ env.FFMPEG_REF }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidplayer-ffmpeg-wasm-${{ env.FFMPEG_REF }}
          path: |
            dist/voidplayer-ffmpeg-wasm-${{ env.FFMPEG_REF }}.zip
            dist/voidplayer-ffmpeg-wasm-${{ env.FFMPEG_REF }}/voidplayer-ffmpeg-manifest.json
          if-no-files-found: error

      - name: Publish release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voidplayer-ffmpeg-wasm-${{ env.FFMPEG_REF }}
          name: VoidPlayer FFmpeg WASM ${{ env.FFMPEG_REF }}
          files: dist/voidplayer-ffmpeg-wasm-${{ env.FFMPEG_REF }}.zip
          fail_on_unmatched_files: true

  windows-x64-msvc:
    name: Windows x64 MSVC
    runs-on: windows-2022
    env:
      FFMPEG_REF: ${{ github.event.inputs.ffmpeg_ref || 'n8.1' }}
      DAV1D_REF: ${{ github.event.inputs.dav1d_ref || '1.5.3' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            git
            base-devel
            diffutils
            make

      - name: Install MSYS2 make
        shell: pwsh
        run: C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed make

      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          $nasmDir = "C:\Program Files\NASM"
          if (Test-Path $nasmDir) {
            Add-Content -Path $env:GITHUB_PATH -Value $nasmDir
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Meson and Ninja
        shell: pwsh
        run: python -m pip install meson ninja

      - name: Build package
        shell: pwsh
        run: >
          ./scripts/build-windows-msvc.ps1
          -FFmpegRef $env:FFMPEG_REF
          -Dav1dRef $env:DAV1D_REF
          -VcpkgRoot C:\vcpkg
          -Clean

      - name: Verify playback surface
        shell: pwsh
        run: |
          $config = ".build\work\ffmpeg-msvc\ffbuild\config.mak"
          if (-not (Test-Path $config)) {
            throw "FFmpeg config not found: $config"
          }
          $required = @(
            "CONFIG_MOV_DEMUXER",
            "CONFIG_MATROSKA_DEMUXER",
            "CONFIG_FLV_DEMUXER",
            "CONFIG_AVI_DEMUXER",
            "CONFIG_MPEGTS_DEMUXER",
            "CONFIG_AAC_DECODER",
            "CONFIG_AC3_DECODER",
            "CONFIG_EAC3_DECODER",
            "CONFIG_MP1_DECODER",
            "CONFIG_MP2_DECODER",
            "CONFIG_MP3_DECODER",
            "CONFIG_DCA_DECODER",
            "CONFIG_TRUEHD_DECODER",
            "CONFIG_APE_DECODER",
            "CONFIG_ALAC_DECODER",
            "CONFIG_H264_DECODER",
            "CONFIG_HEVC_DECODER",
            "CONFIG_VVC_DECODER",
            "CONFIG_AV1_DECODER",
            "CONFIG_LIBDAV1D_DECODER",
            "CONFIG_VVC_PARSER",
            "CONFIG_VVC_MP4TOANNEXB_BSF",
            "CONFIG_D3D12VA",
            "CONFIG_AV1_D3D12VA_HWACCEL",
            "CONFIG_H264_D3D12VA_HWACCEL",
            "CONFIG_HEVC_D3D12VA_HWACCEL",
            "CONFIG_MPEG2_D3D12VA_HWACCEL",
            "CONFIG_VC1_D3D12VA_HWACCEL",
            "CONFIG_VP9_D3D12VA_HWACCEL",
            "CONFIG_WMV3_D3D12VA_HWACCEL"
          )
          foreach ($symbol in $required) {
            if (-not (Select-String -Path $config -Pattern "^$symbol=yes$" -Quiet)) {
              throw "Missing required FFmpeg component: $symbol"
            }
          }

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidplayer-ffmpeg-windows-x64-${{ env.FFMPEG_REF }}
          path: |
            dist/voidplayer-ffmpeg-windows-x64-${{ env.FFMPEG_REF }}.zip
            dist/voidplayer-ffmpeg-windows-x64-${{ env.FFMPEG_REF }}/voidplayer-ffmpeg-manifest.json
          if-no-files-found: error

      - name: Publish release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voidplayer-ffmpeg-windows-x64-${{ env.FFMPEG_REF }}
          name: VoidPlayer FFmpeg Windows x64 ${{ env.FFMPEG_REF }}
          files: dist/voidplayer-ffmpeg-windows-x64-${{ env.FFMPEG_REF }}.zip
          fail_on_unmatched_files: true
