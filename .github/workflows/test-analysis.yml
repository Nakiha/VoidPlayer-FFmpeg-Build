name: Analysis WASM backend regression

on:
  pull_request:
    branches: [wasm]
    paths:
      - '.github/workflows/test-analysis.yml'
      - 'analysis/**'
      - 'fixtures/**'
      - 'shared/vp_capabilities.c'
      - 'scripts/build-analysis.sh'
      - 'scripts/build-quality-library.sh'
      - 'scripts/write-capabilities.mjs'
      - 'scripts/test-analysis-*.mjs'

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.9'
          no-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install synthetic fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip meson ninja-build
      - name: Build exact-head analysis and fixed PR-base comparator
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          git status --porcelain > "$RUNNER_TEMP/evidence/candidate-source-status.txt"
          test ! -s "$RUNNER_TEMP/evidence/candidate-source-status.txt"
          export ANALYSIS_BUILD_ROOT="$RUNNER_TEMP/analysis-wasm-simd-v1"
          export ANALYSIS_DIST_ROOT="$RUNNER_TEMP/candidate"
          bash scripts/build-analysis.sh > "$RUNNER_TEMP/evidence/candidate-build.log" 2>&1
          cp "$RUNNER_TEMP/candidate/manifest.json" "$RUNNER_TEMP/evidence/candidate-manifest.json"
          cp "$RUNNER_TEMP/candidate/capabilities.json" "$RUNNER_TEMP/evidence/candidate-capabilities.json"
          node scripts/test-analysis-build-cache.mjs "$ANALYSIS_BUILD_ROOT"
          cp "$ANALYSIS_BUILD_ROOT/work/config.h" "$RUNNER_TEMP/evidence/config.h"
          git worktree add --detach "$RUNNER_TEMP/baseline-source" "$BASE_SHA"
          git -C "$RUNNER_TEMP/baseline-source" status --porcelain > "$RUNNER_TEMP/evidence/baseline-source-status.txt"
          test ! -s "$RUNNER_TEMP/evidence/baseline-source-status.txt"
          # The shallow candidate clone may not contain the base's different pin.
          ANALYSIS_FFMPEG_SOURCE="https://github.com/Nakiha/FFmpeg.git" \
          ANALYSIS_BUILD_ROOT="$RUNNER_TEMP/analysis-base" \
          ANALYSIS_DIST_ROOT="$RUNNER_TEMP/baseline" \
            bash "$RUNNER_TEMP/baseline-source/scripts/build-analysis.sh" > "$RUNNER_TEMP/evidence/baseline-build.log" 2>&1
          cp "$RUNNER_TEMP/baseline/manifest.json" "$RUNNER_TEMP/evidence/baseline-manifest.json"
          cp "$RUNNER_TEMP/baseline/capabilities.json" "$RUNNER_TEMP/evidence/baseline-capabilities.json"
          # Pin the baseline expectation to the base branch's declared revision
          # instead of the test's fallback literal, which goes stale on pin bumps.
          echo "BASELINE_FFMPEG_REVISION=$(sed -n 's/^REV=\([a-f0-9]\{40\}\)$/\1/p' "$RUNNER_TEMP/baseline-source/scripts/build-analysis.sh")" >> "$GITHUB_ENV"
      - name: Verify pixel scoring and memory heatmap ABI
        run: node scripts/test-analysis-quality.mjs "$RUNNER_TEMP/candidate"
      - name: Verify sort ties, boundaries, collector budgets and cancellation
        run: node scripts/test-analysis-sort.mjs "$RUNNER_TEMP/analysis-wasm-simd-v1" "$RUNNER_TEMP/baseline-source" "$RUNNER_TEMP/evidence/block-sort.json"
      - name: Generate test patterns and compare complete ABI and failure behavior
        env:
          BASELINE_REVISION: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/fixtures"
          ffmpeg -version > "$RUNNER_TEMP/evidence/fixture-tools.txt"
          cp .github/workflows/test-analysis.yml "$RUNNER_TEMP/evidence/generator-workflow.yml"
          ffmpeg -v error -f lavfi -i testsrc2=size=128x64:rate=30 -frames:v 60 -c:v libx264 -pix_fmt yuv420p \
            -x264-params 'threads=1:keyint=30:min-keyint=30:scenecut=0:open-gop=0:bframes=2' "$RUNNER_TEMP/fixtures/h264.mp4"
          ffmpeg -v error -f lavfi -i testsrc2=size=128x64:rate=30 -frames:v 180 -c:v libx265 -pix_fmt yuv420p -tag:v hvc1 \
            -x265-params 'pools=none:frame-threads=1:keyint=60:min-keyint=60:scenecut=0:open-gop=0:bframes=3:log-level=error' "$RUNNER_TEMP/fixtures/hevc.mp4"
          ffmpeg -v error -f lavfi -i testsrc2=size=128x64:rate=30 -frames:v 60 -c:v libx265 -pix_fmt yuv420p10le -tag:v hvc1 \
            -x265-params 'pools=none:frame-threads=1:keyint=30:min-keyint=30:scenecut=0:open-gop=0:bframes=3:log-level=error' "$RUNNER_TEMP/fixtures/hevc10.mp4"
          ffmpeg -v error -f lavfi -i testsrc2=size=320x192:rate=24 -frames:v 48 -c:v libx264 -pix_fmt yuv420p -profile:v high \
            -x264-params 'threads=1:cabac=0:8x8dct=1:keyint=24:min-keyint=24:scenecut=0:open-gop=0:bframes=2:slices=2' "$RUNNER_TEMP/fixtures/h264-cavlc.mp4"
          ffmpeg -v error -f lavfi -i testsrc2=size=320x192:rate=24 -frames:v 48 -c:v libx264 -pix_fmt yuv420p -flags +ildct+ilme \
            -x264-params 'threads=1:interlaced=1:tff=1:keyint=24:min-keyint=24:scenecut=0:open-gop=0:bframes=2' "$RUNNER_TEMP/fixtures/h264-mbaff.mp4"
          ffmpeg -v error -f lavfi -i testsrc2=size=128x64:rate=24 -frames:v 48 -c:v libx264 -pix_fmt yuv420p10le \
            -x264-params 'threads=1:keyint=24:min-keyint=24:scenecut=0:open-gop=0:bframes=2' "$RUNNER_TEMP/fixtures/h264-10.mp4"
          node scripts/test-analysis-backend.mjs "$RUNNER_TEMP/baseline/voidplayer-analysis.js" \
            "$RUNNER_TEMP/candidate/voidplayer-analysis.js" "$RUNNER_TEMP/evidence/oracle.json" "$RUNNER_TEMP/fixtures/h264.mp4" "$RUNNER_TEMP/fixtures/h264-cavlc.mp4" "$RUNNER_TEMP/fixtures/h264-mbaff.mp4" "$RUNNER_TEMP/fixtures/h264-10.mp4" "$RUNNER_TEMP/fixtures/hevc.mp4" "$RUNNER_TEMP/fixtures/hevc10.mp4"
          ffmpeg -v error -f lavfi -i testsrc2=size=128x64:rate=30 -frames:v 4 -c:v libx265 -pix_fmt yuv420p -tag:v hev1 \
            -x265-params 'pools=none:frame-threads=1:lossless=1:keyint=4:bframes=0:log-level=error' "$RUNNER_TEMP/fixtures/hevc-lossless.mp4"
          # VVC has no encoder in the runner's ffmpeg, and its ffprobe predates
          # VVC; the checked-in fixture is the first 16 frames of the QA Main10
          # sample, copied with -c copy (no re-encode), plus a recorded packet
          # sidecar (preferred when present, bound to the container hash).
          # sha256 3f63aa8f130c558276ddedb443a7b74c36d2c895be034dcc838fb153b75611da.
          cp fixtures/analysis/vvc-main10-420-16f.mp4 "$RUNNER_TEMP/fixtures/vvc.mp4"
          cp fixtures/analysis/vvc-main10-420-16f.mp4.packets.json "$RUNNER_TEMP/fixtures/vvc.mp4.packets.json"
          node scripts/test-analysis-execution.mjs "$RUNNER_TEMP/candidate/voidplayer-analysis.js" \
            "$RUNNER_TEMP/evidence/execution.json" "$RUNNER_TEMP/fixtures/h264.mp4" "$RUNNER_TEMP/fixtures/hevc.mp4" "$RUNNER_TEMP/fixtures/hevc10.mp4" "$RUNNER_TEMP/fixtures/hevc-lossless.mp4" "$RUNNER_TEMP/fixtures/vvc.mp4"
          cd "$RUNNER_TEMP/candidate"
          sha256sum * > "$RUNNER_TEMP/evidence/members.sha256"
          zip -X "$RUNNER_TEMP/analysis-${{ github.event.pull_request.head.sha }}.zip" ./*
          sha256sum "$RUNNER_TEMP/analysis-${{ github.event.pull_request.head.sha }}.zip" > "$RUNNER_TEMP/evidence/archive.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/analysis-*.zip
          if-no-files-found: error
